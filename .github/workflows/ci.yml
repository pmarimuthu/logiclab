name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated types are up to date
        run: |
          pnpm gen:types
          git diff --exit-code -- packages/circuit-domain/src/generated

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Module boundaries
        run: pnpm depcruise

      - name: Unit, domain and simulator tests
        run: pnpm test

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Contract check (schemas, registry, reference vectors)
        run: |
          python -m pip install --quiet "jsonschema>=4.18"
          pnpm contracts:check

      - name: Build web app
        run: pnpm build

      - name: Release guard (G-17)
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          if grep -rq "logiclab.example" apps/web/dist; then
            echo "Placeholder domain logiclab.example found in release build" && exit 1
          fi

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
